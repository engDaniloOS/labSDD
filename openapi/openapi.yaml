openapi: 3.0.3
info:
  title: TechLog API
  description: >-
    API REST de pedidos da TechLog. Os endpoints `GET /pedidos`, `GET /pedidos/{id}` e
    `POST /pedidos` são anteriores a este contrato e mantêm a nomenclatura e o formato de
    erro originais (ver `docs/api-pedidos.md`). O endpoint `POST /pedidos/{id}/cancelamento`
    é novo e segue os princípios da constituição do projeto: campos novos em camelCase e
    erros em Problem Details (RFC 9457).
  version: "1.1.0"
servers:
  - url: http://localhost:3000
    description: Servidor local (`npm run dev` / `npm start`)

security: []
# A API não tem autenticação implementada em nenhuma rota — security vazio reflete o
# estado real do código, não uma omissão do contrato.

paths:
  /pedidos:
    get:
      summary: Listar pedidos
      operationId: listarPedidos
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra os pedidos pelo status exato.
          schema:
            $ref: "#/components/schemas/Status"
      responses:
        "200":
          description: Lista de pedidos (vazia se nenhum pedido corresponder ao filtro).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pedido"
    post:
      summary: Criar pedido
      operationId: criarPedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovoPedido"
      responses:
        "201":
          description: Pedido criado, com `status` inicial `"criado"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "400":
          description: "Corpo da requisição inválido (ex.: `cliente` ausente)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroValidacaoLegado"

  /pedidos/{id}:
    get:
      summary: Buscar pedido por id
      operationId: buscarPedido
      parameters:
        - $ref: "#/components/parameters/PedidoId"
      responses:
        "200":
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "404":
          description: Nenhum pedido com esse id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroNaoEncontradoLegado"

  /pedidos/{id}/cancelamento:
    post:
      summary: Cancelar pedido
      description: >-
        Cancela um pedido que ainda não foi enviado (`status` em `criado` ou `pago`).
        Pedidos `enviado`, `entregue` ou já `cancelado` não podem ser cancelados.
      operationId: cancelarPedido
      parameters:
        - $ref: "#/components/parameters/PedidoId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelamentoRequest"
      responses:
        "200":
          description: "Pedido cancelado — devolvido com status \"cancelado\" e canceladoEm preenchido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "404":
          description: Nenhum pedido com esse id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: /problemas/pedido-nao-encontrado
                title: Pedido não encontrado
                status: 404
                detail: Não existe pedido com o id PED-9999.
                instance: /pedidos/PED-9999/cancelamento
        "409":
          description: >-
            Pedido não pode ser cancelado porque já está `enviado`, `entregue` ou
            `cancelado`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: /problemas/pedido-nao-cancelavel
                title: Pedido não pode ser cancelado
                status: 409
                detail: O pedido PED-1003 está com status "enviado" e não pode ser cancelado.
                instance: /pedidos/PED-1003/cancelamento

components:
  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      description: "Identificador do pedido (ex.: `PED-1001`)."
      schema:
        type: string
        example: PED-1001

  schemas:
    Status:
      type: string
      enum: [criado, pago, enviado, entregue, cancelado]

    Item:
      type: object
      required: [sku, quantidade, preco_unitario]
      properties:
        sku:
          type: string
        quantidade:
          type: integer
          minimum: 1
        preco_unitario:
          type: number
          format: double

    FormaPagamentoCartao:
      type: object
      required: [tipo, bandeira, parcelas, final_cartao]
      properties:
        tipo:
          type: string
          enum: [cartao]
        bandeira:
          type: string
        parcelas:
          type: integer
          minimum: 1
        final_cartao:
          type: string

    FormaPagamentoPix:
      type: object
      required: [tipo, chave]
      properties:
        tipo:
          type: string
          enum: [pix]
        chave:
          type: string

    FormaPagamentoBoleto:
      type: object
      required: [tipo, linha_digitavel, vencimento]
      properties:
        tipo:
          type: string
          enum: [boleto]
        linha_digitavel:
          type: string
        vencimento:
          type: string
          format: date

    FormaPagamento:
      oneOf:
        - $ref: "#/components/schemas/FormaPagamentoCartao"
        - $ref: "#/components/schemas/FormaPagamentoPix"
        - $ref: "#/components/schemas/FormaPagamentoBoleto"
      discriminator:
        propertyName: tipo
        mapping:
          cartao: "#/components/schemas/FormaPagamentoCartao"
          pix: "#/components/schemas/FormaPagamentoPix"
          boleto: "#/components/schemas/FormaPagamentoBoleto"

    NovoPedido:
      type: object
      required: [cliente, itens, forma_pagamento]
      properties:
        cliente:
          type: string
        itens:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Item"
        forma_pagamento:
          $ref: "#/components/schemas/FormaPagamento"

    Pedido:
      type: object
      required: [id, cliente, status, valor_total, criadoEm, forma_pagamento, itens]
      properties:
        id:
          type: string
          example: PED-1001
        cliente:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        valor_total:
          type: number
          format: double
        criadoEm:
          type: string
          format: date-time
        forma_pagamento:
          $ref: "#/components/schemas/FormaPagamento"
        itens:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        canceladoEm:
          type: string
          format: date-time
          description: Presente somente quando `status` é `"cancelado"`.
        motivo:
          type: string
          description: Presente somente quando um motivo foi informado no cancelamento.

    CancelamentoRequest:
      type: object
      properties:
        motivo:
          type: string
          description: Motivo do cancelamento, em texto livre. Opcional.

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    ErroNaoEncontradoLegado:
      type: object
      description: Formato de erro legado (rotas anteriores a este contrato).
      properties:
        erro:
          type: string

    ErroValidacaoLegado:
      type: object
      description: Formato de erro legado (rotas anteriores a este contrato).
      properties:
        message:
          type: string
        code:
          type: string
